name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: linux-amd64
    steps:
      - name: Checkout repository
        run: |
          set -euo pipefail
          if [ ! -d .git ]; then
            git init .
            git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          fi
          git -c "http.extraHeader=Authorization: token ${GITHUB_TOKEN}" fetch --prune --depth 1 origin "${GITHUB_SHA}"
          git checkout --force FETCH_HEAD

      - name: Bootstrap Go 1.27
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/go/bin:$PATH"
          if ! go version 2>/dev/null | grep -q go1.27; then
            mkdir -p "$HOME/.local/go"
            curl -fsSL https://go.dev/dl/go1.27.1.linux-amd64.tar.gz -o /tmp/go.tar.gz
            rm -rf "$HOME/.local/go/go"
            tar -xzf /tmp/go.tar.gz -C "$HOME/.local/go" --strip-components=1
          fi
          go version

      - name: Vet and test
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/go/bin:$PATH"
          go vet ./...
          go test ./...

  deploy_prod:
    if: github.ref == 'refs/heads/main'
    needs: test
    runs-on: linux-amd64
    steps:
      - name: Checkout repository
        run: |
          set -euo pipefail
          if [ ! -d .git ]; then
            git init .
            git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          fi
          # Always deploy the current remote main tip for this workflow.
          # This avoids stale SHA metadata issues from runner/event context.
          git -c "http.extraHeader=Authorization: token ${GITHUB_TOKEN}" fetch --prune --depth 1 origin "refs/heads/main"
          git checkout --force FETCH_HEAD
          git clean -fdx
          echo "Deploying commit: $(git rev-parse HEAD)"

      - name: Deploy to RackNerd
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST_KEY: ${{ secrets.DEPLOY_HOST_KEY }}
        run: |
          set -euo pipefail

          : "${DEPLOY_HOST:?Missing DEPLOY_HOST secret}"
          : "${DEPLOY_USER:?Missing DEPLOY_USER secret}"
          : "${DEPLOY_PATH:?Missing DEPLOY_PATH secret}"

          if [ -z "${DEPLOY_PORT:-}" ]; then
            DEPLOY_PORT="22"
          fi

          case "$DEPLOY_PATH" in
            ""|"/"|"/home"|"/home/$DEPLOY_USER")
              echo "Refusing unsafe DEPLOY_PATH: $DEPLOY_PATH"
              exit 1
              ;;
          esac

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          if [ -n "${DEPLOY_SSH_KEY:-}" ]; then
            KEY_PATH="$HOME/.ssh/id_ed25519"
            printf '%s\n' "$DEPLOY_SSH_KEY" > "$KEY_PATH"
            chmod 600 "$KEY_PATH"
          elif [ -f "$HOME/.ssh/forgejo_deploy" ]; then
            KEY_PATH="$HOME/.ssh/forgejo_deploy"
            chmod 600 "$KEY_PATH"
          else
            echo "Missing DEPLOY_SSH_KEY secret and no $HOME/.ssh/forgejo_deploy key on runner."
            exit 1
          fi

          if [ -n "${DEPLOY_HOST_KEY:-}" ]; then
            printf '%s\n' "$DEPLOY_HOST_KEY" > "$HOME/.ssh/known_hosts"
          else
            ssh-keyscan -p "$DEPLOY_PORT" -H "$DEPLOY_HOST" > "$HOME/.ssh/known_hosts"
          fi
          chmod 600 "$HOME/.ssh/known_hosts"

          SSH_OPTS="-i $KEY_PATH -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts -p $DEPLOY_PORT"

          # Sync source tree to the VPS (same transport as the static-site deploy).
          DEPLOY_LOG="$(mktemp)"
          trap 'rm -f "${DEPLOY_LOG}"' EXIT
          set +e
          {
            ssh $SSH_OPTS "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$DEPLOY_PATH' && find '$DEPLOY_PATH' -mindepth 1 -maxdepth 1 -exec rm -rf {} +"
            git archive --format=tar.gz HEAD | ssh $SSH_OPTS "$DEPLOY_USER@$DEPLOY_HOST" "tar -xzf - -C '$DEPLOY_PATH'"
            ssh $SSH_OPTS "$DEPLOY_USER@$DEPLOY_HOST" "export DEPLOY_PATH='$DEPLOY_PATH'; bash '$DEPLOY_PATH/scripts/deploy-quadlet.sh'"
          } >"${DEPLOY_LOG}" 2>&1
          SSH_RC=$?
          set -e

          cat "${DEPLOY_LOG}"

          # Sentinel guard: the deploy script prints this line first. Absent =
          # script never ran -- refuse to report success.
          if ! grep -q '=== deploy-quadlet starting ===' "${DEPLOY_LOG}"; then
            echo "=== DEPLOY DID NOT RUN: sentinel line not found (ssh rc=${SSH_RC}) ===" >&2
            exit 1
          fi
          if [ "${SSH_RC}" -ne 0 ]; then
            echo "=== DEPLOY FAILED: remote exited with code ${SSH_RC} ===" >&2
            exit "${SSH_RC}"
          fi
          echo "=== deploy_prod complete ==="

      - name: Verify public endpoint
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5 6; do
            if curl -fsS --max-time 15 https://hackernews.hoopnerd.xyz/ >/dev/null; then
              echo "https://hackernews.hoopnerd.xyz is healthy"
              exit 0
            fi
            echo "Endpoint not ready yet (attempt ${i}/6), waiting 10s..."
            sleep 10
          done
          echo "Public endpoint verification failed" >&2
          exit 1
